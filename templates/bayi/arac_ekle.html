<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araç Ekle - Bayi Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- ÜST MENÜ ÇUBUĞU -->
    <nav class="navbar">
        <div class="navbar-brand">
            <h2>🚗 OTO GALERİ - BAYİ</h2>
        </div>
        <div class="navbar-menu">
            <a href="{{ url_for('bayi_dashboard') }}" class="nav-link">Ana Sayfa</a>
            <a href="{{ url_for('bayi_araclar') }}" class="nav-link">Araçlarım</a>
            <a href="{{ url_for('bayi_arac_ekle') }}" class="nav-link active">Araç Ekle</a>
            <a href="{{ url_for('bayi_alim_talepleri') }}" class="nav-link">Alım Talepleri</a>
            <a href="{{ url_for('bayi_satim_talepleri') }}" class="nav-link">Satım Talepleri</a>
            <span class="user-info">👨‍💼 {{ session.ad }} {{ session.soyad }}</span>
            <a href="{{ url_for('logout') }}" class="btn btn-secondary">Çıkış</a>
        </div>
    </nav>

    <div class="container">
        <!-- BAŞLIK BÖLÜMÜ -->
        <div class="page-header">
            <h1>➕ Yeni Araç Ekle</h1>
            <p>Stoğa yeni araç ekleyin</p>
        </div>

        <!-- ARAÇ EKLEME FORMU -->
        <div class="form-container">
            <div class="form-card">
                <h2>Araç Bilgileri</h2>
                
                <!-- FORM BAŞLANGICI - POST İLE VERİ GÖNDERİLİR -->
                <form method="POST" action="{{ url_for('bayi_arac_ekle') }}">
                    
                    <!-- MARKA VE MODEL -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>Marka *</label>
                            <input type="text" name="marka" required placeholder="Örn: Renault">
                        </div>
                        
                        <div class="form-group">
                            <label>Model *</label>
                            <input type="text" name="model" required placeholder="Örn: Clio">
                        </div>
                    </div>

                    <!-- YIL VE KİLOMETRE -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>Yıl *</label>
                            <input type="number" name="yil" required placeholder="Örn: 2021" min="1990" max="2026">
                        </div>
                        
                        <div class="form-group">
                            <label>Kilometre *</label>
                            <input type="number" name="kilometre" required placeholder="Örn: 45000" min="0">
                        </div>
                    </div>

                    <!-- YAKIT VE VİTES -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>Yakıt Tipi *</label>
                            <select name="yakit" required>
                                <option value="">Seçiniz</option>
                                <option value="Benzin">Benzin</option>
                                <option value="Dizel">Dizel</option>
                                <option value="LPG">LPG</option>
                                <option value="Elektrik">Elektrik</option>
                                <option value="Hybrid">Hybrid</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Vites Tipi *</label>
                            <select name="vites" required>
                                <option value="">Seçiniz</option>
                                <option value="Manuel">Manuel</option>
                                <option value="Otomatik">Otomatik</option>
                                <option value="Yarı Otomatik">Yarı Otomatik</option>
                            </select>
                        </div>
                    </div>

                    <!-- RENK VE PLAKA -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>Renk *</label>
                            <input type="text" name="renk" required placeholder="Örn: Beyaz">
                        </div>
                        
                        <div class="form-group">
                            <label>Plaka *</label>
                            <input type="text" name="plaka" required placeholder="Örn: 21 ABC 001">
                        </div>
                    </div>

                    <!-- FİYAT VE DURUM -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fiyat (₺) *</label>
                            <input type="number" name="fiyat" required placeholder="Örn: 850000" step="0.01" min="0">
                        </div>
                        
                        <div class="form-group">
                            <label>Araç Durumu *</label>
                            <select name="arac_durumu" required>
                                <option value="">Seçiniz</option>
                                <option value="Satista" selected>Satışta</option>
                                <option value="Rezerve">Rezerve</option>
                                <option value="Satildi">Satıldı</option>
                            </select>
                        </div>
                    </div>

                    <!-- AÇIKLAMA -->
                    <div class="form-group">
                        <label>Açıklama</label>
                        <textarea name="aciklama" rows="4" placeholder="Araç hakkında detaylı bilgi..."></textarea>
                    </div>

                    <!-- FORM BUTONLARI -->
                    <div class="form-actions">
                        <a href="{{ url_for('bayi_araclar') }}" class="btn btn-secondary">İptal</a>
                        <button type="submit" class="btn btn-primary">✅ Aracı Kaydet</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
