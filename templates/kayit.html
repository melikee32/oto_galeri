<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol - Oto Galeri</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-box">
        <h1>🚗 OTO GALERİ</h1>
        <h2>Yeni Üye Ol</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST">
            <input type="text" name="ad" placeholder="Ad" required>
            <input type="text" name="soyad" placeholder="Soyad" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="tel" name="telefon" placeholder="Telefon" required>
            <input type="password" name="sifre" placeholder="Şifre" required minlength="3">
            <button type="submit">Kayıt Ol</button>
        </form>
        
        <div class="signup-link">
            <p>Zaten üye misiniz? <a href="{{ url_for('login') }}">Giriş Yap</a></p>
        </div>
    </div>
</body>
</html>
