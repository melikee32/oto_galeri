<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Oto Galeri</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <h1>🚗 OTO GALERİ</h1>
            <h2>Kayıt Ol</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST" action="{{ url_for('kayit') }}">
                <div class="form-row">
                    <div class="form-group">
                        <label>Ad</label>
                        <input type="text" name="ad" required placeholder="Adınız">
                    </div>
                    
                    <div class="form-group">
                        <label>Soyad</label>
                        <input type="text" name="soyad" required placeholder="Soyadınız">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="ornek@email.com">
                </div>
                
                <div class="form-group">
                    <label>Telefon</label>
                    <input type="tel" name="telefon" required placeholder="05XXXXXXXXX">
                </div>
                
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" name="sifre" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Kayıt Ol</button>
            </form>
            
            <div class="login-footer">
                <p>Zaten hesabınız var mı? <a href="{{ url_for('login') }}">Giriş Yap</a></p>
            </div>
        </div>
    </div>
</body>
</html>
